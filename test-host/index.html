<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebCLAP Test Host</title>
    <link rel="stylesheet" href="host.css">
</head>
<body>
<header>
    <h1 id="title">WebCLAP test host <span>loading…</span></h1>
    <button id="audio" title="Browsers start audio only after a click">Start audio</button>
    <div id="stats"></div>
</header>
<main>
    <section id="window">
        <div class="titlebar">
            <span>Plugin window</span>
            <span id="windowSize"></span>
            <button id="reopen" title="Close and reopen the plugin window (gui destroy, create, new page). The page says hello and gets a snapshot.">Reopen</button>
        </div>
        <div id="viewport"><iframe id="plugin" title="Plugin editor"></iframe></div>
        <div id="keyboard" title="Notes: click, or the computer keys A W S E D F T G Y H U J K (Z/X octave)"></div>
    </section>
    <aside>
        <section>
            <h2>Host</h2>
            <div class="row">
                <label for="automate">Automate</label>
                <select id="automate"></select>
                <button id="automateToggle">Start</button>
            </div>
            <div class="row">
                <button id="saveState" title="clap.state save">Save state</button>
                <button id="loadState" title="clap.state load of the saved state" disabled>Load state</button>
                <span id="stateInfo" class="muted"></span>
            </div>
            <div class="row">
                <label><input id="callbacks" type="checkbox" checked> Host calls on_main_thread</label>
                <span class="muted" title="Off: behave like a host that ignores request_callback. The plugin then sends page updates from process.">(off tests the fallback)</span>
            </div>
            <div id="midi" class="row muted"></div>
        </section>
        <section class="grow">
            <h2>Parameters <input id="filter" type="search" placeholder="Filter"></h2>
            <div id="params" class="scroll"></div>
        </section>
        <section class="grow">
            <h2>Messages <span id="counts" class="muted"></span><button id="clearLog">Clear</button></h2>
            <div id="log" class="scroll mono"></div>
        </section>
    </aside>
</main>
<script src="host.js"></script>
</body>
</html>
